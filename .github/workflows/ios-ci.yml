name: iOS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain and choose explicit CI compatibility target
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Detected Xcode: ${XCODE_VERSION}"
          echo "Detected iOS Simulator SDK: ${SDK_VERSION}"
          if [[ "${XCODE_VERSION}" == 27.* && "${SDK_VERSION}" == 27.* ]]; then
            echo "LEXIDAWN_CI_DEPLOYMENT_TARGET=27.0" >> "$GITHUB_ENV"
            echo "LEXIDAWN_CI_TOOLCHAIN_STATUS=spec-target" >> "$GITHUB_ENV"
          else
            echo "::warning::Xcode 27 / iOS 27 SDK is unavailable; using explicit CI compatibility target 26.5 for build/test only. The project remains configured for iOS 27.0 and M0 acceptance remains blocked."
            echo "LEXIDAWN_CI_DEPLOYMENT_TARGET=26.5" >> "$GITHUB_ENV"
            echo "LEXIDAWN_CI_TOOLCHAIN_STATUS=compatibility-fallback" >> "$GITHUB_ENV"
          fi
      - name: Build unsigned simulator app
        run: |
          echo "CI toolchain mode: ${LEXIDAWN_CI_TOOLCHAIN_STATUS}"
          echo "Effective CI deployment target: ${LEXIDAWN_CI_DEPLOYMENT_TARGET}"
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -sdk iphonesimulator -configuration Debug IPHONEOS_DEPLOYMENT_TARGET="${LEXIDAWN_CI_DEPLOYMENT_TARGET}" CODE_SIGNING_ALLOWED=NO build
      - name: Run tests
        run: |
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -sdk iphonesimulator -configuration Debug IPHONEOS_DEPLOYMENT_TARGET="${LEXIDAWN_CI_DEPLOYMENT_TARGET}" CODE_SIGNING_ALLOWED=NO test
