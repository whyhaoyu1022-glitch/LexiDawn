name: iOS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer main commit supersedes stale verification; its complete suite is still required.
concurrency:
  group: lexidawn-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build once, complete unit and network gate
    runs-on: macos-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved compatibility toolchain
        run: bash scripts/ci-prepare.sh
      - name: Verify exhaustive test plan
        id: plan
        run: |
          python3 scripts/ci-test-plan.py verify
          echo "matrix=$(python3 scripts/ci-test-plan.py matrix)" >> "$GITHUB_OUTPUT"
      - name: Compile app and every test target once
        run: |
          set -euo pipefail
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -derivedDataPath "${RUNNER_TEMP}/LexiDawn-derived" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug IPHONEOS_DEPLOYMENT_TARGET=26.5 CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES SWIFT_OPTIMIZATION_LEVEL=-Onone -parallel-testing-enabled NO build-for-testing 2>&1 | tee "${RUNNER_TEMP}/LexiDawn-build.log"
      - name: Verify generated native launch configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYINFO'
          import os, pathlib, plistlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "LexiDawn-derived/Build/Products/Debug-iphonesimulator/LexiDawn.app/Info.plist"
          with path.open("rb") as stream:
              info = plistlib.load(stream)
          assert isinstance(info.get("UILaunchScreen"), dict), "Missing native UILaunchScreen"
          assert isinstance(info.get("UIApplicationSceneManifest"), dict), "Missing native scene manifest"
          print("Bundle:", info.get("CFBundleIdentifier"))
          print("MinimumOSVersion:", info.get("MinimumOSVersion"))
          print("Native launch screen and scene manifest present")
          PYINFO
      - name: Build Release without screenshot or fault fixtures
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -derivedDataPath "${RUNNER_TEMP}/LexiDawn-release" -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' IPHONEOS_DEPLOYMENT_TARGET="${LEXIDAWN_CI_DEPLOYMENT_TARGET}" CODE_SIGNING_ALLOWED=NO build
          python3 - <<'PYRELEASE'
          import os, pathlib, plistlib
          app = pathlib.Path(os.environ['RUNNER_TEMP']) / 'LexiDawn-release/Build/Products/Release-iphonesimulator/LexiDawn.app'
          with (app / 'Info.plist').open('rb') as stream:
              name = plistlib.load(stream)['CFBundleExecutable']
          data = (app / name).read_bytes()
          for marker in [b'round3-dictionary-', b'round3-storage-', b'Explicit original dictionary UI fixture', b'gallery-round3-review', b'round3-phrases']:
              assert marker not in data, 'Debug evidence fixture leaked into Release'
          print('Release built; explicit screenshot/fault fixture markers excluded.')
          PYRELEASE
      - name: Boot unit simulator
        run: bash scripts/ci-simulator.sh iPhone-17-Pro
      - name: Run every unit, migration and real network test
        timeout-minutes: 12
        run: |
          set -euo pipefail
          TEST_RUN_FILE="$(python3 -c 'import os,pathlib; print(next((pathlib.Path(os.environ["RUNNER_TEMP"])/"LexiDawn-derived/Build/Products").glob("*.xctestrun")))')"
          xcodebuild test-without-building -xctestrun "$TEST_RUN_FILE" -destination "platform=iOS Simulator,id=${LEXIDAWN_SIMULATOR_ID}" -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/LexiDawn-unit.xcresult" -only-testing:LexiDawnTests 2>&1 | tee "${RUNNER_TEMP}/LexiDawn-unit.log"
      - name: Publish diagnostic evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LexiDawn-unit-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/LexiDawn-unit.log
            ${{ runner.temp }}/LexiDawn-build.log
            ${{ runner.temp }}/LexiDawn-unit.xcresult
          if-no-files-found: warn
      - name: Archive reusable compiled simulator tests
        run: |
          set -euo pipefail
          xcodebuild -version > "${RUNNER_TEMP}/ci-build-toolchain.txt"
          uname -m >> "${RUNNER_TEMP}/ci-build-toolchain.txt"
          tar -C "${RUNNER_TEMP}/LexiDawn-derived/Build" -czf "${RUNNER_TEMP}/LexiDawn-test-products.tgz" Products
      - uses: actions/upload-artifact@v4
        with:
          name: LexiDawn-compiled-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/LexiDawn-test-products.tgz
            ${{ runner.temp }}/ci-build-toolchain.txt
          compression-level: 0
          if-no-files-found: error

  ui-tests:
    name: Native UI · ${{ matrix.suite }} · ${{ matrix.device }}
    needs: build-and-test
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.build-and-test.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: LexiDawn-compiled-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiled-tests
      - name: Verify identical toolchain and restore executable test products
        run: |
          set -euo pipefail
          xcodebuild -version > "${RUNNER_TEMP}/ci-ui-toolchain.txt"
          uname -m >> "${RUNNER_TEMP}/ci-ui-toolchain.txt"
          diff "${RUNNER_TEMP}/compiled-tests/ci-build-toolchain.txt" "${RUNNER_TEMP}/ci-ui-toolchain.txt"
          mkdir -p "${RUNNER_TEMP}/LexiDawn-derived/Build"
          tar -C "${RUNNER_TEMP}/LexiDawn-derived/Build" -xzf "${RUNNER_TEMP}/compiled-tests/LexiDawn-test-products.tgz"
          bash scripts/ci-prepare.sh
          bash scripts/ci-simulator.sh '${{ matrix.device }}'
      - name: Execute complete assigned UI shard without rebuilding
        timeout-minutes: 35
        run: |
          set -euo pipefail
          python3 scripts/ci-test-plan.py selectors '${{ matrix.suite }}' > "${RUNNER_TEMP}/ci-tests.txt"
          TEST_SELECTORS=()
          while IFS= read -r selection; do TEST_SELECTORS+=("$selection"); done < "${RUNNER_TEMP}/ci-tests.txt"
          test "${#TEST_SELECTORS[@]}" -gt 0
          TEST_RUN_FILE="$(python3 -c 'import os,pathlib; print(next((pathlib.Path(os.environ["RUNNER_TEMP"])/"LexiDawn-derived/Build/Products").glob("*.xctestrun")))')"
          xcodebuild test-without-building -xctestrun "$TEST_RUN_FILE" -destination "platform=iOS Simulator,id=${LEXIDAWN_SIMULATOR_ID}" -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/ui.xcresult" "${TEST_SELECTORS[@]}" 2>&1 | tee "${RUNNER_TEMP}/ui.log"
      - name: Export untouched native screenshots and metadata on success or failure
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "${RUNNER_TEMP}/ui.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "${RUNNER_TEMP}/ui.xcresult" --output-path "${RUNNER_TEMP}/native-attachments"
            python3 scripts/export-round3-evidence.py "${RUNNER_TEMP}/native-attachments" "${RUNNER_TEMP}/native-evidence/screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LexiDawn-round3-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-evidence
            ${{ runner.temp }}/native-attachments
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/ui.log
            ${{ runner.temp }}/ci-tests.txt
          if-no-files-found: error

  combined-native-evidence:
    name: Combine original PNG evidence and complete index
    needs: [build-and-test, ui-tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: LexiDawn-round3-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-jobs
      - name: Verify hashes and combine untouched native PNGs
        run: python3 scripts/merge-round3-evidence.py native-jobs combined-round3 --commit '${{ github.sha }}' --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - uses: actions/upload-artifact@v4
        with:
          name: LexiDawn-round3-complete-native-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: combined-round3
          if-no-files-found: error
