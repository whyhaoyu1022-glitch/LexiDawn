name: iOS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'export: run only the export diagnostic first; full regression follows only on success'
        type: choice
        options: [full, export]
        default: full

# A new main commit normally supersedes stale verification. Keep a previous native
# capture running when its evidence is required for a before/after comparison.
concurrency:
  group: lexidawn-ios-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[keep-native-evidence]') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  final-acceptance-ipa:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[round4-final]') }}
    uses: ./.github/workflows/unsigned-ipa.yml
    permissions:
      contents: read
    with:
      final_acceptance: true

  round4-core:
    name: Round 4 · compile and deterministic core checks
    if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[round4-core]') || contains(github.event.head_commit.message, '[round4-ui]')) }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-prepare.sh
      - name: Compile app and all test targets
        run: |
          set -euo pipefail
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -derivedDataPath "${RUNNER_TEMP}/round4" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug IPHONEOS_DEPLOYMENT_TARGET=26.5 CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES build-for-testing 2>&1 | tee "${RUNNER_TEMP}/round4-build.log"
      - run: bash scripts/ci-simulator.sh iPhone-17-Pro
      - name: Run Round 4 deterministic checks only
        timeout-minutes: 8
        run: |
          set -euo pipefail
          TEST_RUN_FILE="$(python3 -c 'import os,pathlib; print(next((pathlib.Path(os.environ["RUNNER_TEMP"])/"round4/Build/Products").glob("*.xctestrun")))')"
          xcodebuild test-without-building -xctestrun "$TEST_RUN_FILE" -destination "platform=iOS Simulator,id=${LEXIDAWN_SIMULATOR_ID}" -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/round4-core.xcresult" -only-testing:LexiDawnTests/Round4Tests -only-testing:LexiDawnTests/MDXDictionaryTests 2>&1 | tee "${RUNNER_TEMP}/round4-core.log"
      - name: Isolate UI simulator after core tests
        if: contains(github.event.head_commit.message, '[round4-ui]')
        run: |
          xcrun simctl shutdown "$LEXIDAWN_SIMULATOR_ID"
          bash scripts/ci-simulator.sh iPhone-17-Pro
      - name: Run Round 4 native UI and screenshots only
        if: contains(github.event.head_commit.message, '[round4-ui]')
        timeout-minutes: 25
        run: |
          set -euo pipefail
          TEST_RUN_FILE="$(python3 -c 'import os,pathlib; print(next((pathlib.Path(os.environ["RUNNER_TEMP"])/"round4/Build/Products").glob("*.xctestrun")))')"
          xcodebuild test-without-building -xctestrun "$TEST_RUN_FILE" -destination "platform=iOS Simulator,id=${LEXIDAWN_SIMULATOR_ID}" -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/round4-ui.xcresult" -only-testing:LexiDawnUITests/Round4UITests 2>&1 | tee "${RUNNER_TEMP}/round4-ui.log"
      - name: Export original Round 4 screenshots even on failure
        if: ${{ always() && contains(github.event.head_commit.message, '[round4-ui]') }}
        run: |
          if [[ -f "${RUNNER_TEMP}/round4-ui.xcresult/Info.plist" ]]; then
            xcrun xcresulttool export attachments --path "${RUNNER_TEMP}/round4-ui.xcresult" --output-path "${RUNNER_TEMP}/round4-native"
            python3 scripts/export-round4-evidence.py "${RUNNER_TEMP}/round4-native" "${RUNNER_TEMP}/round4-evidence/screenshots" --commit '${{ github.sha }}' --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' --test-log "${RUNNER_TEMP}/round4-ui.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LexiDawn-round4-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/round4-build.log
            ${{ runner.temp }}/round4-core.log
            ${{ runner.temp }}/round4-core.xcresult
            ${{ runner.temp }}/round4-ui.log
            ${{ runner.temp }}/round4-ui.xcresult
            ${{ runner.temp }}/round4-native
            ${{ runner.temp }}/round4-evidence
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: ${{ always() && contains(github.event.head_commit.message, '[round4-ui]') }}
        with:
          name: LexiDawn-round4-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/round4-evidence
          compression-level: 0
          if-no-files-found: warn

  export-check:
    name: Export diagnostic · one UI method
    if: ${{ inputs.scope == 'export' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[export-only]')) }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-prepare.sh
      - name: Compile tests for isolated export diagnostic
        run: |
          set -euo pipefail
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -derivedDataPath "${RUNNER_TEMP}/export-derived" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug IPHONEOS_DEPLOYMENT_TARGET=26.5 CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES SWIFT_OPTIMIZATION_LEVEL=-Onone build-for-testing 2>&1 | tee "${RUNNER_TEMP}/export-build.log"
      - run: bash scripts/ci-simulator.sh iPhone-17-Pro
      - name: Test only export callback lifetime before native UI
        timeout-minutes: 3
        run: |
          set -euo pipefail
          TEST_RUN_FILE="$(python3 -c 'import os,pathlib; print(next((pathlib.Path(os.environ["RUNNER_TEMP"])/"export-derived/Build/Products").glob("*.xctestrun")))')"
          xcodebuild test-without-building -xctestrun "$TEST_RUN_FILE" -destination "platform=iOS Simulator,id=${LEXIDAWN_SIMULATOR_ID}" -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/export-lifecycle.xcresult" -only-testing:LexiDawnTests/Round3Tests/testVocabularyExportCallbackSurvivesPresentationDismissalAndRejectsOldRequest 2>&1 | tee "${RUNNER_TEMP}/export-lifecycle.log"
      - name: Isolate native UI from the app-hosted lifecycle test simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcrun simctl list devices --json > "${RUNNER_TEMP}/export-unit-simulator-state.json"
          UNIT_SIM_STATE="$(python3 -c 'import json,os,pathlib; data=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"export-unit-simulator-state.json").read_text()); matches=[v for values in data["devices"].values() for v in values if v["udid"]==os.environ["LEXIDAWN_SIMULATOR_ID"]]; assert len(matches)==1; print(matches[0]["state"])')"
          case "$UNIT_SIM_STATE" in
            Booted) xcrun simctl shutdown "$LEXIDAWN_SIMULATOR_ID" ;;
            Shutdown) ;;
            *) echo "::error::Unexpected lifecycle simulator state: $UNIT_SIM_STATE"; exit 1 ;;
          esac
          bash scripts/ci-simulator.sh iPhone-17-Pro
      - name: Test only real vocabulary export cancellation and JSON CSV save
        timeout-minutes: 12
        run: |
          set -euo pipefail
          TEST_RUN_FILE="$(python3 -c 'import os,pathlib; print(next((pathlib.Path(os.environ["RUNNER_TEMP"])/"export-derived/Build/Products").glob("*.xctestrun")))')"
          xcodebuild test-without-building -xctestrun "$TEST_RUN_FILE" -destination "platform=iOS Simulator,id=${LEXIDAWN_SIMULATOR_ID}" -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/export.xcresult" -only-testing:LexiDawnUITests/Round3UITests/testVocabularyStatusSortConfirmedMeaningAndNativeExportDialogs 2>&1 | tee "${RUNNER_TEMP}/export-ui.log"
      - name: Verify exactly one diagnostic test completed
        run: |
          python3 - <<'PYEXPORT'
          import os, pathlib, re
          log = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'export-ui.log').read_text()
          counts = re.findall(r'Executed (\d+) tests?, with (\d+) failures', log)
          assert counts and all(value == ('1', '0') for value in counts), counts
          print('Exactly one export UI method completed with zero failures.')
          PYEXPORT
      - name: Export diagnostic native attachments even on failure
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/export.xcresult/Info.plist" ]]; then
            xcrun xcresulttool export attachments --path "${RUNNER_TEMP}/export.xcresult" --output-path "${RUNNER_TEMP}/export-attachments"
            python3 scripts/export-round3-evidence.py "${RUNNER_TEMP}/export-attachments" "${RUNNER_TEMP}/export-evidence"
          fi
      - uses: actions/upload-artifact@v4
        id: upload_export
        if: always()
        continue-on-error: true
        with:
          name: LexiDawn-export-check-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/export-build.log
            ${{ runner.temp }}/export-lifecycle.log
            ${{ runner.temp }}/export-lifecycle.xcresult
            ${{ runner.temp }}/export-unit-simulator-state.json
            ${{ runner.temp }}/export-ui.log
            ${{ runner.temp }}/export.xcresult
            ${{ runner.temp }}/export-attachments
            ${{ runner.temp }}/export-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        name: Retry export diagnostic evidence upload
        if: ${{ always() && steps.upload_export.outcome == 'failure' }}
        with:
          name: LexiDawn-export-check-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          compression-level: 0
          path: |
            ${{ runner.temp }}/export-build.log
            ${{ runner.temp }}/export-lifecycle.log
            ${{ runner.temp }}/export-lifecycle.xcresult
            ${{ runner.temp }}/export-unit-simulator-state.json
            ${{ runner.temp }}/export-ui.log
            ${{ runner.temp }}/export.xcresult
            ${{ runner.temp }}/export-attachments
            ${{ runner.temp }}/export-evidence
          if-no-files-found: error

  build-and-test:
    needs: export-check
    if: ${{ always() && !cancelled() && !contains(github.event.head_commit.message, '[ipa-only]') && !contains(github.event.head_commit.message, '[round4-core]') && !contains(github.event.head_commit.message, '[round4-ui]') && (needs.export-check.result == 'success' || needs.export-check.result == 'skipped') }}
    name: Build once, complete unit and network gate
    runs-on: macos-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      compiled_artifact_id: ${{ steps.compiled-products.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved compatibility toolchain
        run: bash scripts/ci-prepare.sh
      - name: Verify exhaustive test plan
        id: plan
        run: |
          python3 scripts/ci-test-plan.py verify
          echo "matrix=$(python3 scripts/ci-test-plan.py matrix)" >> "$GITHUB_OUTPUT"
      - name: Compile app and every test target once
        id: compile-tests
        run: |
          set -euo pipefail
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -derivedDataPath "${RUNNER_TEMP}/LexiDawn-derived" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug IPHONEOS_DEPLOYMENT_TARGET=26.5 CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES SWIFT_OPTIMIZATION_LEVEL=-Onone -parallel-testing-enabled NO build-for-testing 2>&1 | tee "${RUNNER_TEMP}/LexiDawn-build.log"
      - name: Verify generated native launch configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYINFO'
          import os, pathlib, plistlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "LexiDawn-derived/Build/Products/Debug-iphonesimulator/LexiDawn.app/Info.plist"
          with path.open("rb") as stream:
              info = plistlib.load(stream)
          assert isinstance(info.get("UILaunchScreen"), dict), "Missing native UILaunchScreen"
          assert isinstance(info.get("UIApplicationSceneManifest"), dict), "Missing native scene manifest"
          print("Bundle:", info.get("CFBundleIdentifier"))
          print("MinimumOSVersion:", info.get("MinimumOSVersion"))
          print("Native launch screen and scene manifest present")
          PYINFO
      - name: Build Release without screenshot or fault fixtures
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -derivedDataPath "${RUNNER_TEMP}/LexiDawn-release" -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' IPHONEOS_DEPLOYMENT_TARGET="${LEXIDAWN_CI_DEPLOYMENT_TARGET}" CODE_SIGNING_ALLOWED=NO build
          python3 - <<'PYRELEASE'
          import os, pathlib, plistlib
          app = pathlib.Path(os.environ['RUNNER_TEMP']) / 'LexiDawn-release/Build/Products/Release-iphonesimulator/LexiDawn.app'
          with (app / 'Info.plist').open('rb') as stream:
              name = plistlib.load(stream)['CFBundleExecutable']
          data = (app / name).read_bytes()
          for endpoint in [b'api.dictionaryapi.dev', b'en.wiktionary.org', b'zh.wiktionary.org', b'od-api.oxforddictionaries.com']:
              assert endpoint not in data, 'Retired dictionary network endpoint leaked into Release'
          for marker in [b'round3-dictionary-', b'round3-storage-', b'Explicit original dictionary UI fixture', b'gallery-round3-review', b'round3-phrases', b'gallery-review-save-failure', b'round3-import-save-failed']:
              assert marker not in data, 'Debug evidence fixture leaked into Release'
          print('Release built; explicit screenshot/fault fixture markers excluded.')
          PYRELEASE
      - name: Boot unit simulator
        run: bash scripts/ci-simulator.sh iPhone-17-Pro
      - name: Run every unit, migration and real network test
        timeout-minutes: 12
        run: |
          set -euo pipefail
          TEST_RUN_FILE="$(python3 -c 'import os,pathlib; print(next((pathlib.Path(os.environ["RUNNER_TEMP"])/"LexiDawn-derived/Build/Products").glob("*.xctestrun")))')"
          xcodebuild test-without-building -xctestrun "$TEST_RUN_FILE" -destination "platform=iOS Simulator,id=${LEXIDAWN_SIMULATOR_ID}" -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/LexiDawn-unit.xcresult" -only-testing:LexiDawnTests 2>&1 | tee "${RUNNER_TEMP}/LexiDawn-unit.log"
      - name: Publish diagnostic evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LexiDawn-unit-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/LexiDawn-unit.log
            ${{ runner.temp }}/LexiDawn-build.log
            ${{ runner.temp }}/LexiDawn-unit.xcresult
          if-no-files-found: warn
      - name: Archive reusable compiled simulator tests
        id: archive-tests
        if: ${{ always() && !cancelled() && steps.compile-tests.outcome == 'success' }}
        run: |
          set -euo pipefail
          xcodebuild -version > "${RUNNER_TEMP}/ci-build-toolchain.txt"
          uname -m >> "${RUNNER_TEMP}/ci-build-toolchain.txt"
          tar -C "${RUNNER_TEMP}/LexiDawn-derived/Build" -czf "${RUNNER_TEMP}/LexiDawn-test-products.tgz" Products
      - uses: actions/upload-artifact@v4
        id: compiled-products
        if: ${{ always() && !cancelled() && steps.archive-tests.outcome == 'success' }}
        with:
          name: LexiDawn-compiled-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/LexiDawn-test-products.tgz
            ${{ runner.temp }}/ci-build-toolchain.txt
          compression-level: 0
          if-no-files-found: error

  ui-tests:
    name: Native UI · ${{ matrix.suite }} · ${{ matrix.device }}
    needs: build-and-test
    if: ${{ always() && !cancelled() && needs.build-and-test.outputs.compiled_artifact_id != '' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-and-test.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: LexiDawn-compiled-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiled-tests
      - name: Verify identical toolchain and restore executable test products
        run: |
          set -euo pipefail
          xcodebuild -version > "${RUNNER_TEMP}/ci-ui-toolchain.txt"
          uname -m >> "${RUNNER_TEMP}/ci-ui-toolchain.txt"
          diff "${RUNNER_TEMP}/compiled-tests/ci-build-toolchain.txt" "${RUNNER_TEMP}/ci-ui-toolchain.txt"
          mkdir -p "${RUNNER_TEMP}/LexiDawn-derived/Build"
          tar -C "${RUNNER_TEMP}/LexiDawn-derived/Build" -xzf "${RUNNER_TEMP}/compiled-tests/LexiDawn-test-products.tgz"
          bash scripts/ci-prepare.sh
          bash scripts/ci-simulator.sh '${{ matrix.device }}'
      - name: Execute complete assigned UI shard without rebuilding
        timeout-minutes: 35
        run: |
          set -euo pipefail
          python3 scripts/ci-test-plan.py selectors '${{ matrix.suite }}' > "${RUNNER_TEMP}/ci-tests.txt"
          TEST_SELECTORS=()
          while IFS= read -r selection; do TEST_SELECTORS+=("$selection"); done < "${RUNNER_TEMP}/ci-tests.txt"
          test "${#TEST_SELECTORS[@]}" -gt 0
          TEST_RUN_FILE="$(python3 -c 'import os,pathlib; print(next((pathlib.Path(os.environ["RUNNER_TEMP"])/"LexiDawn-derived/Build/Products").glob("*.xctestrun")))')"
          xcodebuild test-without-building -xctestrun "$TEST_RUN_FILE" -destination "platform=iOS Simulator,id=${LEXIDAWN_SIMULATOR_ID}" -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/ui.xcresult" "${TEST_SELECTORS[@]}" 2>&1 | tee "${RUNNER_TEMP}/ui.log"
          python3 scripts/verify-ui-execution.py "${RUNNER_TEMP}/ci-tests.txt" "${RUNNER_TEMP}/ui.log"
      - name: Export untouched native screenshots and metadata on success or failure
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "${RUNNER_TEMP}/ui.xcresult/Info.plist" ]]; then
            xcrun xcresulttool export attachments --path "${RUNNER_TEMP}/ui.xcresult" --output-path "${RUNNER_TEMP}/native-attachments"
            python3 scripts/export-round3-evidence.py "${RUNNER_TEMP}/native-attachments" "${RUNNER_TEMP}/native-evidence/screenshots"
          else
            echo "No finalized xcresult after interruption; retained UI log is diagnostic, not successful screenshot evidence."
          fi
      - uses: actions/upload-artifact@v4
        id: upload_ui_evidence
        if: always()
        continue-on-error: true
        with:
          name: LexiDawn-round3-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/native-evidence
            ${{ runner.temp }}/native-attachments
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/ui.log
            ${{ runner.temp }}/ci-tests.txt
          if-no-files-found: error
      - name: Retry native evidence upload after a transient artifact service failure
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.upload_ui_evidence.outcome == 'failure' }}
        with:
          name: LexiDawn-round3-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          compression-level: 0
          path: |
            ${{ runner.temp }}/native-evidence
            ${{ runner.temp }}/native-attachments
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/ui.log
            ${{ runner.temp }}/ci-tests.txt
          if-no-files-found: error

  ui-completion-gate:
    name: Require all native UI shards to finish
    needs: [build-and-test, ui-tests]
    if: ${{ always() && !cancelled() && needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject skipped or failed native verification
        env:
          UI_RESULT: ${{ needs.ui-tests.result }}
        run: |
          test "$UI_RESULT" = success || { echo "Native UI verification is $UI_RESULT, not passed."; exit 1; }

  combined-native-evidence:
    name: Combine original PNG evidence and complete index
    needs: [build-and-test, ui-tests]
    if: ${{ always() && !cancelled() && needs.ui-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: LexiDawn-round3-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-jobs
      - name: Validate the original-photo packaging script
        run: python3 -m py_compile scripts/package-round4-screenshots.py
      - name: Verify hashes and combine untouched native PNGs
        run: python3 scripts/merge-round3-evidence.py native-jobs combined-round3 --commit '${{ github.sha }}' --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Index current native evidence against Round 4 without claiming acceptance
        if: always()
        run: |
          mapfile -t UI_LOGS < <(find native-jobs -name ui.log -type f)
          python3 scripts/export-round4-evidence.py native-jobs combined-round4/screenshots --commit '${{ github.sha }}' --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' --test-log "${UI_LOGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LexiDawn-round4-current-native-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          path: combined-round4/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LexiDawn-round4-original-attachments-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          path: combined-round4/original-pngs.zip
          if-no-files-found: warn
      - name: Verify every required state and per-source native evidence
        run: python3 scripts/verify-round3-coverage.py combined-round3/manifest.json --report combined-round3/COVERAGE.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LexiDawn-round3-complete-native-package-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          path: combined-round3
          if-no-files-found: error
