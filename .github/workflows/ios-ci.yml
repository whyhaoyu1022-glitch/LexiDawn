name: iOS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain and select approved CI target
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Detected Xcode: ${XCODE_VERSION}"
          echo "Detected iOS Simulator SDK: ${SDK_VERSION}"
          echo "LEXIDAWN_CI_DEPLOYMENT_TARGET=26.5" >> "$GITHUB_ENV"
          echo "LEXIDAWN_CI_TOOLCHAIN_STATUS=approved-compatibility-26.5" >> "$GITHUB_ENV"
          echo "CI deployment target: 26.5 (explicitly approved compatibility target)"
      - name: Build unsigned simulator app
        run: |
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -sdk iphonesimulator -configuration Debug IPHONEOS_DEPLOYMENT_TARGET="${LEXIDAWN_CI_DEPLOYMENT_TARGET}" CODE_SIGNING_ALLOWED=NO build
      - name: Select and boot scheme-accepted iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          DESTINATIONS_FILE="${RUNNER_TEMP}/lexidawn-destinations.txt"
          if ! xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -sdk iphonesimulator -configuration Debug IPHONEOS_DEPLOYMENT_TARGET="${LEXIDAWN_CI_DEPLOYMENT_TARGET}" -showdestinations >"${DESTINATIONS_FILE}" 2>&1; then
            echo "::error::xcodebuild could not enumerate destinations for the LexiDawn scheme."
            cat "${DESTINATIONS_FILE}"
            exit 1
          fi
          cat "${DESTINATIONS_FILE}"
          SIMULATOR_ID="$(python3 - "${DESTINATIONS_FILE}" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read().splitlines()
          preferred = []
          fallback = []
          for line in text:
              if "platform:iOS Simulator" not in line or "id:" not in line or "name:" not in line:
                  continue
              match = re.search(r"id:([^,}]+)", line)
              if not match:
                  continue
              identifier = match.group(1).strip()
              if identifier.startswith("dvtdevice-") or identifier == "placeholder":
                  continue
              if "name:iPhone" in line:
                  preferred.append(identifier)
              else:
                  fallback.append(identifier)
          print((preferred or fallback or [""])[0])
          PY
          )"
          if [[ -z "${SIMULATOR_ID}" ]]; then
            echo "::error::No concrete iOS Simulator destination accepted by the LexiDawn scheme."
            echo "Available simctl devices (for diagnosis only):"
            xcrun simctl list devices available
            exit 1
          fi
          if ! grep -F "id:${SIMULATOR_ID}" "${DESTINATIONS_FILE}" >/dev/null; then
            echo "::error::Selected simulator was not returned by xcodebuild -showdestinations."
            exit 1
          fi
          echo "Using scheme-accepted simulator id: ${SIMULATOR_ID}"
          echo "LEXIDAWN_SIMULATOR_ID=${SIMULATOR_ID}" >> "$GITHUB_ENV"
          xcrun simctl boot "${SIMULATOR_ID}" 2>/dev/null || true
          xcrun simctl bootstatus "${SIMULATOR_ID}" -b
      - name: Run unit and UI tests on concrete simulator
        run: |
          xcodebuild -project LexiDawn.xcodeproj -scheme LexiDawn -sdk iphonesimulator -destination "id=${LEXIDAWN_SIMULATOR_ID}" -configuration Debug IPHONEOS_DEPLOYMENT_TARGET="${LEXIDAWN_CI_DEPLOYMENT_TARGET}" CODE_SIGNING_ALLOWED=NO test

